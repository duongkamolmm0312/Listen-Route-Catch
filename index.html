const audio={ctx:null,master:null,bgmGain:null,timer:null,step:0,ensure(){if(this.ctx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.bgmGain=this.ctx.createGain();this.master.gain.value=state.settings.bgm||state.settings.sfx?0.22:0;this.bgmGain.gain.value=state.settings.bgm ? .32 : 0;this.bgmGain.connect(this.master);this.master.connect(this.ctx.destination)},note(freq,d=.12,type='sine',vol=.12,dest){this.ensure();if(!this.ctx||!state.settings.sfx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+d);o.connect(g);g.connect(dest||this.master);o.start();o.stop(this.ctx.currentTime+d)},click(){this.note(480,.06,'triangle',.08)},ok(){[660,880,1100].forEach((f,i)=>setTimeout(()=>this.note(f,.18,'sine',.12),i*80))},bad(){this.note(220,.18,'sine',.08)},startBgm(){this.ensure();clearInterval(this.timer);if(!this.ctx||!state.settings.bgm)return;const notes=[523,659,784,659,587,698,880,698];this.timer=setInterval(()=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='triangle';o.frequency.value=notes[this.step++%notes.length];g.gain.setValueAtTime(.045,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.35);o.connect(g);g.connect(this.bgmGain);o.start();o.stop(this.ctx.currentTime+.36)},420)},stop(){clearInterval(this.timer)}};
function speak(text,rate=.82){if(!state.settings.voice||!('speechSynthesis'in window))return;audio.ensure();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1.08;if(audio.bgmGain)audio.bgmGain.gain.setTargetAtTime(.12,audio.ctx.currentTime,.05);u.onend=()=>{if(audio.bgmGain)audio.bgmGain.gain.setTargetAtTime(state.settings.bgm ? .32 : 0,audio.ctx.currentTime,.2)};speechSynthesis.speak(u)}

function renderCatch(x){const listening=CONFIG.type==='listenCatch'||state.mode.includes('Listening')||state.mode.includes('Audio');setTarget(listening?'🎧 Listen and catch!':`Catch: ${promptLabel(x)}`);const catcher=document.createElement('div');catcher.className='catcher';catcher.id='catcher';catcher.textContent=CONFIG.type==='listenCatch'?'🥅':'🎟️';$('#gameLayer').appendChild(catcher);const st=$('#cameraStage');st.onpointermove=e=>{if(state.control!=='camera'){const r=st.getBoundingClientRect();catcher.style.left=clamp((e.clientX-r.left)/r.width*100,8,92)+'%'}};falling=[];for(let i=0;i<6;i++){const o=i===0?x:sample(state.items.filter(y=>y.word!==x.word),1)[0];const el=document.createElement('button');el.className='game-choice catch-item hand-target';el.dataset.answer=o.word;el.innerHTML=`<span class="emoji">${o.emoji}</span><span>${listening?'?':esc(o.word)}</span>`;el.style.left=(8+Math.random()*75)+'%';el.dataset.y=String(-80-i*125);el.dataset.speed=String(.75+Math.random()*.75);$('#gameLayer').appendChild(el);falling.push(el)};animateCatch()}
function animateCatch(){if(state.screen!=='PLAYING'||state.answered)return;const stage=$('#cameraStage'),catcher=$('#catcher');if(!stage||!catcher)return;const sr=stage.getBoundingClientRect(),cr=catcher.getBoundingClientRect();for(const el of falling){let y=+el.dataset.y+(Date.now()<state.freezeUntil?0:+el.dataset.speed);el.dataset.y=y;el.style.transform=`translateY(${y}px)`;const r=el.getBoundingClientRect();if(r.bottom>cr.top&&r.top<cr.bottom&&r.right>cr.left&&r.left<cr.right){answer(el.dataset.answer===current().word,el.dataset.answer,el);return}if(y>sr.height+120){el.dataset.y=-120;el.style.left=(5+Math.random()*82)+'%'}}animFrame=requestAnimationFrame(animateCatch)}

function renderSentence(x){setTarget('Build the sentence / เรียงประโยค');sentenceTarget=x.sentence.replace(/[.?!]/g,'').split(/\s+/);sentenceAnswer=[];const area=document.createElement('div');area.className='sentence-area';area.innerHTML=`<div class="answer-strip" id="answerStrip"><span class="tiny">แตะคำตามลำดับ / Tap words in order</span></div><div class="word-bank" id="wordBank">${shuffle(sentenceTarget).map((w,i)=>`<button class="word-token hand-target" data-word="${esc(w)}" data-id="${i}">${esc(w)}</button>`).join('')}</div><div class="menu-row"><button class="btn green hand-target" id="checkSentence">✅ Check</button><button class="btn gray" id="undoSentence">↩️ Undo</button></div>`;$('#gameLayer').append(area);$$('.word-token').forEach(b=>b.onclick=()=>{sentenceAnswer.push(b.textContent);b.disabled=true;b.style.opacity=.4;renderSentenceAnswer()});$('#undoSentence').onclick=()=>{if(sentenceAnswer.length){sentenceAnswer.pop();const used={};$$('.word-token').forEach(b=>{const w=b.textContent, count=sentenceAnswer.filter(v=>v===w).length;used[w]=(used[w]||0)+1;b.disabled=used[w]<=count;b.style.opacity=b.disabled?.4:1});renderSentenceAnswer()}};$('#checkSentence').onclick=()=>answer(sentenceAnswer.join(' ').toLowerCase()===sentenceTarget.join(' ').toLowerCase(),sentenceAnswer.join(' '))}

function quizPrompt(x){const qs=[{text:`Which category is “${x.word}”?`,spoken:`Which category is ${x.word}?`,correct:x.cat==='place'?'Place':x.cat==='transport'?'Transport':'Travel word'},{text:`What does “${x.word}” mean?`,spoken:`What does ${x.word} mean?`,correct:x.th},{text:`Choose the word for ${x.emoji}`,spoken:`Choose the correct word.`,correct:x.word}];return qs[state.q%qs.length]}

function burst(){if(state.settings.reduceEffects)return;const gl=$('#gameLayer');const n=state.settings.quality==='low'?12:state.settings.quality==='medium'?22:36;for(let i=0;i<n;i++){const c=document.createElement('i');c.className='confetti';c.style.left=(45+Math.random()*10)+'%';c.style.top='35%';c.style.background=`hsl(${Math.random()*360} 90% 65%)`;c.style.setProperty('--dx',(Math.random()*500-250)+'px');gl.appendChild(c);setTimeout(()=>c.remove(),1300)}}

function usePower(i){if(usedPowers.has(i))return;usedPowers.add(i);const b=$(`.powerBtn[data-power="${i}"]`);if(b){b.disabled=true;b.style.opacity=.5}if(i===0){const correct=CONFIG.type==='quiz'?quizPrompt(current()).correct:CONFIG.type==='roleplay'?roleCorrect:current().word;$$('[data-answer]').forEach(el=>{if(el.dataset.answer===correct)el.style.boxShadow='0 0 0 8px #ffe84a,0 0 45px #fff'})}else if(i===1){state.freezeUntil=Date.now()+7000;feedback('⏱️ TIME FROZEN!',true)}else if(i===2){state.double=true;feedback('⭐ DOUBLE SCORE!',true)}else{state.hearts++;updateHud();feedback('💖 EXTRA HEART!',true)}}
function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#speechResult').textContent='เบราว์เซอร์นี้ไม่รองรับ Speech Recognition — กด “I said it” หลังฝึกพูด';return}const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;const btn=$('#micBtn');btn.classList.add('listening');$('#speechResult').textContent='Listening…';r.onresult=e=>{const said=[...e.results[0]].map(a=>a.transcript);const target=state.mode.includes('Sentence')?current().sentence:current().word;const score=Math.max(...said.map(s=>similarity(s.toLowerCase(),target.toLowerCase())));$('#speechResult').textContent=`You said: ${said[0]} · ${Math.round(score*100)}%`;btn.classList.remove('listening');setTimeout(()=>answer(score>.55,said[0]),350)};r.onerror=e=>{$('#speechResult').textContent='Microphone error: '+e.error;btn.classList.remove('listening')};r.onend=()=>btn.classList.remove('listening');r.start()}
function similarity(a,b){a=a.replace(/[^a-z ]/g,'').trim();b=b.replace(/[^a-z ]/g,'').trim();if(a.includes(b)||b.includes(a))return 1;const A=new Set(a.split('')),B=new Set(b.split(''));let n=0;A.forEach(x=>B.has(x)&&n++);return n/Math.max(A.size,B.size,1)}

async function startCamera(calibration=false){stopCamera();const video=$('#cameraVideo'),canvas=$('#handCanvas');if(!video||!canvas)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:state.facing},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();applyMirror();resizeCanvas();if(window.Hands){hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.55,minTrackingConfidence:.55});hands.onResults(onHands);const loop=async()=>{if(!stream||!hands)return;try{await hands.send({image:video})}catch(e){}handLoop=requestAnimationFrame(loop)};loop();$('#handStatus').textContent='🖐️ Show your hand / ยกมือขึ้น'}else{$('#handStatus').textContent='MediaPipe CDN unavailable — Mouse/Touch still works'} }catch(e){state.control='mouse';const s=$('#handStatus');if(s)s.textContent='Camera unavailable — switched to Mouse/Touch';setTimeout(()=>{if(state.screen==='CALIBRATION')show('ROUND')},900)}}

function onHands(res){const c=$('#handCanvas'),stage=$('#cameraStage');if(!c||!stage)return;const ctx=c.getContext('2d'),r=stage.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!res.multiHandLandmarks?.length){const s=$('#handStatus');if(s)s.textContent='👋 Move hand into view';return}const lm=res.multiHandLandmarks[0],pts=lm.map(mapLm);ctx.strokeStyle='#78f4ff';ctx.lineWidth=4;const conn=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];conn.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(pts[a].x,pts[a].y);ctx.lineTo(pts[b].x,pts[b].y);ctx.stroke()});pts.forEach((p,i)=>{ctx.fillStyle=i===8?'#ffe44e':'#ff73c6';ctx.beginPath();ctx.arc(p.x,p.y,i===8?9:5,0,Math.PI*2);ctx.fill()});const tip=pts[8],alpha=.28*state.settings.sensitivity;lastHand.x=lastHand.x?(lastHand.x*(1-alpha)+tip.clientX*alpha):tip.clientX;lastHand.y=lastHand.y?(lastHand.y*(1-alpha)+tip.clientY*alpha):tip.clientY;const pinch=Math.hypot(pts[4].x-pts[8].x,pts[4].y-pts[8].y)<42;updateCursor(lastHand.x,lastHand.y,pinch);const s=$('#handStatus');if(s)s.textContent=`🖐️ Hand Detected · ${pinch?'Pinch':'Point'}`;const g=$('#gestureHud');if(g)g.textContent=pinch?'Pinch':'Point';handInteract(lastHand.x,lastHand.y,pinch)}
function updateCursor(x,y,pinch){const c=$('#handCursor');c.style.display='block';c.style.left=x+'px';c.style.top=y+'px';c.classList.toggle('pinch',pinch)}
function handInteract(x,y,pinch){if(state.paused)return;const el=document.elementFromPoint(x,y)?.closest('.hand-target,button,[data-answer],[data-bin]');if(el!==dwellEl){dwellEl?.classList.remove('hovered');dwellEl=el;dwellStart=performance.now();el?.classList.add('hovered')}if(el&&performance.now()-dwellStart>600&&!pinch){dwellStart=performance.now()+9999;el.click()}if(pinch&&!pinchWas){if(CONFIG.type==='drag'||CONFIG.type==='sort'){const d=el?.closest('.drag-token,.sort-card');if(d){handDrag=d;d.classList.add('dragging')}}else el?.click()}if(handDrag){handDrag.style.left=x+'px';handDrag.style.top=y+'px'}if(!pinch&&pinchWas&&handDrag){const zone=document.elementFromPoint(x,y);const val=handDrag.dataset.answer;handDrag.classList.remove('dragging');handDrag.removeAttribute('style');if(CONFIG.type==='drag'){const ok=zone?.closest('.drag-zone');if(ok)answer(val===current().word,val)}else{const bin=zone?.closest('[data-bin]');if(bin){const correct=['place','transport'].includes(current().cat)?current().cat:'other';answer(bin.dataset.bin===correct,bin.dataset.bin)}}handDrag=null}pinchWas=pinch;if((CONFIG.type==='catch'||CONFIG.type==='listenCatch')&&state.screen==='PLAYING'){const st=$('#cameraStage')?.getBoundingClientRect(),cat=$('#catcher');if(st&&cat)cat.style.left=clamp((x-st.left)/st.width*100,8,92)+'%'}}
window.addEventListener('resize',()=>setTimeout(resizeCanvas,100));window.addEventListener('orientationchange',()=>setTimeout(resizeCanvas,300));
$('#homeBtn').onclick=()=>{stopCamera();show('COVER')};$('#fullBtn').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{})};$('#muteBtn').onclick=()=>{state.settings.bgm=!state.settings.bgm;state.settings.sfx=state.settings.bgm;$('#muteBtn').textContent=state.settings.bgm?'🔊':'🔇';state.settings.bgm?audio.startBgm():audio.stop();save()};$('#langBtn').onclick=()=>{state.settings.lang=state.settings.lang==='en'?'th':'en';save();show(state.screen)};
$('#screen').addEventListener('click',e=>{const sp=e.target.closest('[data-speak]');if(sp)speak(sp.dataset.speak);if(e.target.id==='beginRound'){newRound();let n=3;const btn=e.target;btn.disabled=true;const it=setInterval(()=>{btn.textContent=n>0?`${n--}`:'GO!';if(n<-1){clearInterval(it);show('PLAYING')}},650)}if(e.target.id==='calDone'){save();show('ROUND')}if(e.target.id==='calFallback'){state.control='mouse';stopCamera();show('ROUND')}if(e.target.id==='switchCam'){state.facing=state.facing==='user'?'environment':'user';state.settings.mirrorCamera=state.facing==='user';startCamera(true)}if(e.target.id==='fixMirror'){state.settings.mirrorCamera=!state.settings.mirrorCamera;const mt=$('#mirrorToggle');if(mt)mt.checked=state.settings.mirrorCamera;applyMirror()}if(e.target.id==='saveSettings'){$$('[data-setting]').forEach(i=>{state.settings[i.dataset.setting]=i.type==='checkbox'?i.checked:i.type==='range'?+i.value:i.value});save();show('COVER')}if(e.target.id==='addItem'){state.items.push({word:'new word',th:'คำใหม่',cat:'travel',emoji:'⭐',sentence:'This is a new word.'});$('#itemRows').innerHTML=teacherRows()}if(e.target.closest('.delRow')){const tr=e.target.closest('tr');state.items.splice(+tr.dataset.i,1);$('#itemRows').innerHTML=teacherRows()}if(e.target.id==='saveTeacher'){const arr=$$('#itemRows tr').map(tr=>({word:$('.w',tr).value.trim(),th:$('.th',tr).value.trim(),cat:$('.cat',tr).value,emoji:$('.em',tr).value.trim()||'⭐',sentence:$('.sen',tr).value.trim()})).filter(x=>x.word);state.items=arr;state.settings.roundLength=+$('#roundLength').value;state.settings.roundTime=+$('#roundTime').value;state.settings.hearts=+$('#heartSet').value;save();feedbackToast('Saved!');show('COVER')}if(e.target.id==='exportBtn'){const blob=new Blob([JSON.stringify({settings:state.settings,items:state.items,lastReport:state.lastReport},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=CONFIG.slug+'_teacher_settings.json';a.click();URL.revokeObjectURL(a.href)}if(e.target.id==='resetBtn'){state.items=structuredClone(DEFAULT_ITEMS);state.settings.roundLength=10;save();show('TEACHER')}});
$('#screen').addEventListener('change',e=>{if(e.target.id==='mirrorToggle'){state.settings.mirrorCamera=e.target.checked;applyMirror();save()}if(e.target.id==='importFile'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d.items))state.items=d.items;if(d.settings)Object.assign(state.settings,d.settings);save();show('TEACHER')}catch(err){alert('Invalid JSON')}};r.readAsText(f)}});
function feedbackToast(msg){const d=document.createElement('div');d.className='feedback';d.style.position='fixed';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
window.addEventListener('beforeunload',()=>{stopCamera();audio.stop()});
show('COVER');
</script>
